name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint, format, and test
    runs-on: ubuntu-latest

    services:
      # The same image and credentials as compose.yaml, so a failure here is a
      # real failure rather than an environment difference.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: oauth
          POSTGRES_PASSWORD: oauth
          POSTGRES_DB: oauth_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U oauth -d oauth_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      TEST_DATABASE_URL: postgresql://oauth:oauth@127.0.0.1:5433/oauth_test

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run the test suite
        run: uv run pytest -q

      - name: Refuse a committed private key
        run: uv run pre-commit run detect-private-key --all-files
